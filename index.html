        /* --- 1. 开场代码雨 Canvas --- */
        canvas#matrix {

            width: 100%;
            height: 100%;
            background: black;
            transition: opacity 1s ease-in-out; /* 淡出动画 2秒 */
        }
        
        /* 隐藏状态 */
        canvas.hidden {

            pointer-events: none; /* 让鼠标能穿透过去点击网页 */
        }

        /* --- 2. 网页主容器 --- */
        #main-content {
            opacity: 0; /* 初始完全透明 */

            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        #main-content.visible {
            opacity: 1;
        }

        /* 标题样式 */
        h2 {

            color: var(--primary-color);
            margin: 60px 0 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        /* --- 3. 照片墙 (Grid 布局) --- */
        .photo-wall {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .photo-item {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            /*aspect-ratio: 4/3; */ /* 固定长宽比 */
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7; /* 默认稍微暗一点 */
            transition: transform 0.5s, opacity 0.5s;
        }

        /* 鼠标悬停特效 */
        .photo-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            transform: translateY(-5px);
        }
        .photo-item:hover img {
            opacity: 1;
            transform: scale(1.1); /* 图片放大 */
        }

        /* --- 4. 留言板区域 --- */
        #message-board {

    <script type="module">
       // import { init } from 'https://unpkg.com/@waline/client@v2/dist/waline.mjs';

        // --- 1. 启动留言板 ---
       // init({
        //    el: '#waline',

          //  emoji: true,     // 简约风格，关掉表情包（可选）
            //placeholder: '输入信号... (System Ready)',
       // });

        // --- 2. 启动代码雨动画 ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        // 设置全屏
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '0123456789??????-SYSTEM-CONNECTING-アイウエオカキクケ-?????';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function draw() {
            // 拖尾效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // 30毫秒刷新一次
        const interval = setInterval(draw, 30);

        // --- 3. 3秒后自动切换 ---
        setTimeout(() => {
            // 1. 给 Canvas 添加 hidden 类（触发淡出）
            document.getElementById('matrix').classList.add('hidden');
            // 2. 显示主内容
            document.getElementById('main-content').classList.add('visible');
            
            // 3. 动画结束后停止绘图，节省电脑资源
            setTimeout(() => clearInterval(interval), 2000);
        }, 3000); //  这里的 5000 代表 5秒

        setTimeout(function() {
        const player = document.getElementById('music-container');
        player.style.opacity = '1'; // 变清晰
        player.style.pointerEvents = 'auto'; // 恢复可点击状态
    }, 3000); // 6000 表示 6 秒后执行，你可以根据实际情况调整
        
        // 处理窗口大小改变
        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
